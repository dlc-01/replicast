version: "3.9"

# Базовый шаблон для узла — переиспользуется через YAML anchors
x-node-base: &node-base
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [replicast-net]
  volumes:
    - ./keys:/app/keys:ro
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 15s

# Базовый шаблон для БД
x-db-base: &db-base
  image: postgres:16-alpine
  restart: unless-stopped
  networks: [replicast-net]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U replicast"]
    interval: 3s
    timeout: 5s
    retries: 5

services:

  # ── node-a ─────────────────────────────────────────────────────────
  node-a:
    <<: *node-base
    env_file: envs/node-a.env
    ports:
      - "8081:8080"
    depends_on:
      db-a: { condition: service_healthy }

  db-a:
    <<: *db-base
    environment:
      POSTGRES_USER:     replicast
      POSTGRES_PASSWORD: replicast
      POSTGRES_DB:       replicast
    volumes:
      - db-a-data:/var/lib/postgresql/data

  # ── node-b ─────────────────────────────────────────────────────────
  node-b:
    <<: *node-base
    env_file: envs/node-b.env
    ports:
      - "8082:8080"
    depends_on:
      db-b: { condition: service_healthy }

  db-b:
    <<: *db-base
    environment:
      POSTGRES_USER:     replicast
      POSTGRES_PASSWORD: replicast
      POSTGRES_DB:       replicast
    volumes:
      - db-b-data:/var/lib/postgresql/data

  # ── node-c ─────────────────────────────────────────────────────────
  node-c:
    <<: *node-base
    env_file: envs/node-c.env
    ports:
      - "8083:8080"
    depends_on:
      db-c: { condition: service_healthy }

  db-c:
    <<: *db-base
    environment:
      POSTGRES_USER:     replicast
      POSTGRES_PASSWORD: replicast
      POSTGRES_DB:       replicast
    volumes:
      - db-c-data:/var/lib/postgresql/data

networks:
  replicast-net:
    driver: bridge

volumes:
  db-a-data:
  db-b-data:
  db-c-data: